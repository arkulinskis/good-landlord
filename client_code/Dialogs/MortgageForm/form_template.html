<div class="ui gl-dlg">
  <anvil-component type="Label" name="title_label" prop:role='["dlg-title"]'></anvil-component>
  <anvil-component type="Label" name="lead_label" prop:role='["muted"]'></anvil-component>
  <div class="gl-form-grid">
    <label class="ui-field full"><span>Lender <em>(optional)</em></span><anvil-component type="TextBox" name="lender_box"></anvil-component></label>
    <label class="ui-field"><span>Amount borrowed</span><anvil-component type="TextBox" name="amount_box"></anvil-component></label>
    <label class="ui-field"><span>Interest rate (%)</span><anvil-component type="TextBox" name="rate_box" prop:placeholder="4.79"></anvil-component></label>
    <label class="ui-field"><span>Started on</span><anvil-component type="TextBox" name="start_box"></anvil-component></label>
    <label class="ui-field"><span>Payments</span><anvil-component type="DropDown" name="freq_box"></anvil-component></label>
    <label class="ui-field"><span>Amortisation (years)</span><anvil-component type="TextBox" name="amort_box"></anvil-component><span class="ui-hint">Years to pay it all off.</span></label>
    <label class="ui-field"><span>Term (years)</span><anvil-component type="TextBox" name="term_box"></anvil-component><span class="ui-hint">Until the rate is renewed.</span></label>
    <label class="ui-field full"><span>Interest compounding</span><anvil-component type="DropDown" name="comp_box"></anvil-component></label>
  </div>
  <anvil-component type="Label" name="error_label" prop:role='["msg-error", "full"]' prop:visible="false"></anvil-component>
  <div class="ui-row end dlg-acts"><anvil-component type="Button" name="delete_button" prop:text="Delete" prop:role='["btn", "btn-danger", "ic-trash"]'></anvil-component><span class="ui-spacer"></span><anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component><anvil-component type="Button" name="save_button" prop:text="Save" prop:role='["btn", "btn-primary", "ic-check"]'></anvil-component></div>
</div>
