<div class="gl-room">
  <label class="ui-field gl-room-n"><span>Room</span><anvil-component type="TextBox" name="name_box" prop:placeholder="Kitchen"></anvil-component></label>
  <label class="ui-field gl-room-c"><span>Condition</span><anvil-component type="DropDown" name="cond_box"></anvil-component></label>
  <label class="ui-field gl-room-x"><span>Note <em>(optional)</em></span><anvil-component type="TextBox" name="note_box" prop:placeholder="Scratch on the floor by the door"></anvil-component></label>
  <anvil-component type="Button" name="remove_button" prop:text="" prop:tooltip="Remove this room" prop:role='["btn", "btn-sm", "btn-ghost", "btn-icon", "ic-trash"]'></anvil-component>
</div>
