    <script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "Service", "@id": "https://good-landlord.anvil.app/#app", "name": "Good Landlord", "url": "https://good-landlord.anvil.app/", "description": "Track rent, expenses, mortgage and long-term profit for your rentals, and give tenants a private, tamper-evident record of messages and repairs.", "image": "https://good-landlord.anvil.app/_/theme/og-image.png", "serviceType": "Know your rental numbers. Treat tenants fairly.", "provider": {"@id": "https://arkvital.com/#org"}, "areaServed": "Worldwide", "availableChannel": {"@type": "ServiceChannel", "serviceUrl": "https://good-landlord.anvil.app/", "name": "Web browser"}, "availableLanguage": "en", "audience": {"@type": "Audience", "audienceType": "Small landlords who want to know their numbers and treat tenants fairly"}}, {"@type": "WebSite", "@id": "https://good-landlord.anvil.app/#site", "url": "https://good-landlord.anvil.app/", "name": "Good Landlord", "publisher": {"@id": "https://arkvital.com/#org"}}, {"@type": "Organization", "@id": "https://arkvital.com/#org", "name": "Arkvital", "url": "https://arkvital.com", "email": "arkvital@outlook.com", "address": {"@type": "PostalAddress", "addressLocality": "Montreal", "addressRegion": "QC", "addressCountry": "CA"}}]}</script>
