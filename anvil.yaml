metadata:
  description: "Track rent, expenses, mortgage and long-term profit for your rentals, and give tenants a private, tamper-evident record of messages and repairs."
  logo_img: "asset:icon-512.png"
  title: "Good Landlord: rental numbers and fair tenant records"
name: Good Landlord
