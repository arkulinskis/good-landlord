    <link rel="stylesheet" href="_/theme/app.css?v=9f1b06c1ea">
    <script src="_/theme/app-kit.js?v=6acbab20cb"></script>
    <script src="_/theme/gl.js?v=8b4d95f11c"></script>
package_name: Good_Landlord
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 30
    require_secure_passwords: true
    use_email: true
    use_google: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
startup:
  module: startup
  type: module
